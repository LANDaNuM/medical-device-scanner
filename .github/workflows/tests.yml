name: Testy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Ustaw Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Zainstaluj zależności
      run: |
        pip install pytest
        pip install python-dotenv requests rich numpy

    - name: Uruchom testy
      run: pytest tests/ -v
